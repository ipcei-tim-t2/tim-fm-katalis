apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: timapplications.krateo.tim.it
spec:
  group: krateo.tim.it
  names:
    kind: TimApplication
    listKind: TimApplicationList
    plural: timapplications
    singular: timapplication
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ArgoStatus
          type: string
          jsonPath: .status.health.status
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: State
          type: string
          jsonPath: .status.state
        - name: Age
          jsonPath: .metadata.creationTimestamp
          type: date
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                tenantName: 
                  type: string
                workspaceName:
                  type: string
                x-tim-environment: 
                  type: string
                helm:
                  type: object
                  description: "Helm parameters."
                  properties:
                    repoUrl:
                      type: string
                      description: "Helm chart repository URL."
                    chartName:
                      type: string
                      description: "Helm chart name."
                    version:
                      type: string
                      description: "Helm chart version."
                    values:
                      type: string
                      description: "Helm chart values."
                    namespace:
                      type: string
                      description: "Namespace where to deploy the helm chart."
                    username:
                      type: string
                      description: "Username used for registry authentication."
                    password:
                      type: string
                      description: "Password used for registry authentication."
                  required:
                    - repoUrl
                    - chartName
                    - version
                    - values
                    - namespace
                placement:
                  type: object
                  description: "Parameters for getting clusterIds where to deploy the app. clusterIds or sesRequest are allowed value. At least one of the twos, if both get compiled, clusterIds get precedence."
                  properties:
                    clusterIds:
                      type: array
                      description: "List of clusterIds where to deploy the app."
                      items:
                        type: string
                    zoneId:
                      type: string
              required:
                - helm
                - placement
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                state:
                  type: string
                  description: "State of the TimApplication deployment."
                phase:
                  type: string
                  description: "Phase of the TimApplication deployment."
                health:
                  type: object
                  properties:
                    status:
                      type: string
                      description: "Status of this TimApplication. It binds to ArgoCD Applications generated by ApplicationSet."
                sesResponse:
                  type: object
                  properties:
                    placement:
                      type: object
                      properties:
                        clusterIds:
                          type: array
                          description: "List of clusterIds where app has been deployed."
                          items:
                            type: string
                accessPointInfo:
                  type: array
                  items:
                    type: object 
                    properties:
                      interfaceId:
                        type: string
                      accessPoints:
                        type: array
                        items:
                          type: object
                          properties:
                            fqdn:
                              type: string
                            ipv4Addresses:
                              type: array
                              items:
                                type: string
                            ipv6Addresses:
                              type: array
                              items:
                                type: string
                            ports:
                              type: array
                              minItems: 1
                              items:
                                type: object
                                properties:
                                  port:
                                    type: integer
              x-kubernetes-preserve-unknown-fields: true
