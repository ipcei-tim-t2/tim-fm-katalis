# Sample ExternalSecret syncing IdP client_secret into a local corev1.Secret
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: operator-vault-backend
  namespace: guest
spec:
  provider:
    # Example Vault backend (supports vault, aws, azurekv, gcpsm)
    vault:
      server: "https://vault.internal.telco-operator.com"
      path: "secret"
      version: "v2"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: host-idp-credentials-sync
  namespace: guest
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: operator-vault-backend
    kind: SecretStore
  target:
    name: host-idp-credentials
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: federation/host-operator/credentials
        property: client_secret
